<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - Hỗ trợ khách hàng</title>
  <link rel="stylesheet" href="admin.css?v=6">
  <link rel="stylesheet" href="modern.css?v=1">
</head>
<body>
  <header class="admin-appbar">
    <div class="bar">
      <div class="admin-brand"><span class="dot"></span> Admin</div>
      <nav class="admin-nav">
        <a href="/admin.html">Người dùng</a>
        <a href="/admin-dashboard.html">Tổng quan</a>
        <a href="/admin-products.html">Sản phẩm</a>
        <a href="/admin-inventory.html">Quản lý kho</a>
        <a href="/admin-categories.html">Danh mục</a>
        <a href="/admin-orders.html">Đơn hàng</a>
        <a href="/admin-coupons.html">Mã giảm giá</a>
        <a href="/admin-banners.html">Banners</a>
        <a href="/admin-support.html">Hỗ trợ KH</a>
        <a href="/admin-ai-logs.html">Logs AI</a>
        <a href="/SGBweb.html">Trang chủ</a>
      </nav>
      <button id="adminThemeToggle" class="theme-toggle">Theme</button>
    </div>
  </header>

  <div class="admin-container">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Admin - Hỗ trợ khách hàng</div>
        <div class="table-actions" style="margin-left:auto;align-items:center">
          <span id="supportCountBadge" class="status-badge status-warning">0 mới</span>
          <button id="supportRefreshBtn" class="btn btn-outline">Làm mới hỗ trợ</button>
        </div>
      </div>
      <div class="card-body">
        <div id="guard" style="display:none;padding:10px;background:#fff3cd;border:1px solid #ffeeba;border-radius:6px;color:#856404;margin-top:12px">
          Bạn cần đăng nhập với quyền admin để xem trang này.
          <a href="auth.html" style="margin-left:8px">Đăng nhập</a>
        </div>
        <div id="supportRequestsList" class="support-requests-list">Đang tải yêu cầu hỗ trợ...</div>
      </div>
    </div>
  </div>

  <script>
    const supportList = document.getElementById('supportRequestsList');
    const supportCountBadge = document.getElementById('supportCountBadge');
    const supportRefreshBtn = document.getElementById('supportRefreshBtn');

    function getLogged(){
      try { return JSON.parse(localStorage.getItem('sgb_logged_in') || 'null'); } catch (e) { return null; }
    }

    function requireAdminGuard(){
      const logged = getLogged();
      const ok = !!(logged && logged.role === 'admin');
      document.getElementById('guard').style.display = ok ? 'none' : '';
      return ok;
    }

    function escapeHtml(s){
      return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function formatDateTime(iso){
      try{ return new Date(iso).toLocaleString('vi-VN'); }catch(_){ return String(iso || ''); }
    }

    function renderSupportRequests(items){
      if(!supportList) return;
      if(!items.length){
        supportList.textContent = 'Chưa có yêu cầu hỗ trợ nào.';
        return;
      }
      supportList.innerHTML = items.map((x)=>{
        const id = Number(x.id) || 0;
        const who = [x.customerName, x.customerEmail].filter(Boolean).join(' - ') || 'Khách vãng lai';
        const statusLabel = x.status === 'handled' ? 'Đã xử lý' : 'Mới';
        const statusClass = x.status === 'handled' ? 'status-success' : 'status-warning';
        return `
          <div class="support-request-item" data-id="${id}">
            <div class="support-request-top">
              <div class="support-request-meta"><strong>${escapeHtml(who)}</strong> • ${escapeHtml(formatDateTime(x.createdAt))}</div>
              <span class="status-badge ${statusClass}">${statusLabel}</span>
            </div>
            <p class="support-request-message">${escapeHtml(x.message || '')}</p>
            ${x.trackingCode ? `<div class="support-request-note"><strong>Mã hỗ trợ:</strong> ${escapeHtml(x.trackingCode)}</div>` : ''}
            ${x.note ? `<div class="support-request-note"><strong>Phản hồi:</strong> ${escapeHtml(x.note)}</div>` : ''}
            <div class="support-request-actions">
              <span class="support-request-page">Trang: ${escapeHtml(x.page || '')}</span>
              ${x.status === 'pending' ? `
                <textarea class="support-reply-input" data-id="${id}" placeholder="Nhập phản hồi cho khách hàng..."></textarea>
                <button class="btn btn-primary" data-action="reply" data-id="${id}">Gửi phản hồi & xử lý</button>
              ` : `<span class="status-badge status-success">Đã phản hồi</span>`}
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadSupportRequests(){
      if(!supportList) return;
      if(!requireAdminGuard()) return;
      supportList.textContent = 'Đang tải yêu cầu hỗ trợ...';
      try{
        const logged = getLogged();
        const res = await fetch('/api/support-requests?status=all&limit=40', {
          headers: { 'X-User-Email': logged?.email || '' }
        });
        if(!res.ok) throw new Error('Không tải được yêu cầu hỗ trợ');
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        const pendingCount = Number(data.pendingCount || 0) || 0;
        if(supportCountBadge) supportCountBadge.textContent = `${pendingCount} mới`;
        renderSupportRequests(items);
      }catch(err){
        supportList.textContent = 'Lỗi tải hỗ trợ: ' + err.message;
        if(supportCountBadge) supportCountBadge.textContent = '0 mới';
      }
    }

    supportRefreshBtn && supportRefreshBtn.addEventListener('click', loadSupportRequests);

    supportList && supportList.addEventListener('click', async (e)=>{
      const btn = e.target.closest('button[data-action="reply"]');
      if(!btn) return;
      if(!requireAdminGuard()) return;
      const id = Number(btn.dataset.id || 0);
      if(!id) return;

      const input = supportList.querySelector(`.support-reply-input[data-id="${id}"]`);
      const note = String(input?.value || '').trim();
      if(!note){
        alert('Vui lòng nhập nội dung phản hồi trước khi gửi.');
        input && input.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang gửi...';
      try{
        const logged = getLogged();
        const res = await fetch(`/api/support-requests/${id}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'X-User-Email': logged?.email || ''
          },
          body: JSON.stringify({ status: 'handled', note })
        });
        if(!res.ok){
          const t = await res.text();
          throw new Error(t || 'Gửi phản hồi thất bại');
        }
        await loadSupportRequests();
      }catch(err){
        alert(err.message || 'Không gửi được phản hồi');
        btn.disabled = false;
        btn.textContent = 'Gửi phản hồi & xử lý';
      }
    });

    loadSupportRequests();
  </script>
  <script src="admin.js?v=6"></script>
</body>
</html>
