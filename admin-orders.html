<body>
  <header class="admin-appbar">

    <div class="card">

          </thead>
          <tbody></tbody>
        </table>
        <div id="empty" style="margin-top:12px;color:#a8adbf">Chưa có đơn hàng.</div>

        <div id="detail" class="detail" style="display:none"></div>
      </div>
    </div>
  </div>
