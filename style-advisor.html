<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tư vấn phong cách (AI) — STYLE GLAMOUR BEATS</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="modern.css?v=1">
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial}
    .container{max-width:1100px;margin:0 auto;padding:16px}
    .page{display:grid;grid-template-columns:320px 1fr;gap:24px}
    .card{background:#fff;border:1px solid #eee;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
    .card h2{margin:0;padding:16px;border-bottom:1px solid #f0f0f0}
    .card .content{padding:16px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-group{margin-bottom:12px}
    label{font-weight:600;display:block;margin-bottom:6px}
    input[type=text],input[type=number],select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px}
    .pill{display:inline-block;padding:8px 10px;border:1px solid #ddd;border-radius:999px;margin:4px 6px 0 0;cursor:pointer}
    .pill input{margin-right:6px}
    .chat{display:flex;flex-direction:column;height:560px}
    .chat-log{flex:1;overflow:auto;padding:16px}
    .msg{max-width:80%;padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap}
    .msg.user{margin-left:auto;background:#e8f3ff;border:1px solid #cfe6ff}
    .msg.bot{margin-right:auto;background:#f7f7f7;border:1px solid #eee}
    .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid #eee;align-items:center}
    .chat-input input{flex:1}
    .btn-icon{width:40px;height:40px;border-radius:10px;background:#111;color:#fff;border:none;cursor:pointer;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
    .file-hidden{display:none}
    .badge{font-size:12px;color:#555;margin-left:8px}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
    .btn{display:inline-flex;align-items:center;gap:8px;background:#111;color:#fff;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none}
    .btn:link,.btn:visited{ text-decoration:none; }
    .card .content{padding:16px}
    .product-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
    .product-card-mini{border:1px solid #eee;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(0,0,0,.06)}
    .product-card-mini img{width:100%;height:140px;object-fit:cover}
    .product-card-mini .info{padding:10px;display:flex;flex-direction:column;gap:6px}
    .product-card-mini .name{font-weight:700;font-size:.92rem;line-height:1.3}
    .product-card-mini .price{font-weight:800;color:#0f172a}
    .product-card-mini .actions{display:flex;gap:8px;flex-wrap:wrap}
    .product-card-mini .actions button,.product-card-mini .actions a{flex:1;text-align:center}
    .btn-secondary{background:#f1f5f9;color:#0f172a;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:600}
    .image-search{display:flex;flex-direction:column;gap:10px}
    .image-preview{border:1px dashed #ddd;border-radius:10px;padding:8px;min-height:120px;display:flex;align-items:center;justify-content:center;color:#666;font-size:.9rem;background:#fafafa}
    .image-preview img{max-width:100%;max-height:220px;border-radius:10px;object-fit:contain}

    /* Responsive tweaks for mobile */
    @media (max-width: 900px){
      .page{grid-template-columns:1fr}
      .chat{height:480px}
    }
    @media (max-width: 600px){
      .form-row{grid-template-columns:1fr}
      .container{padding:12px}
      .card .content{padding:12px}
      input[type=text],input[type=number],select,textarea{padding:12px 14px;font-size:.95rem}
      .product-cards{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <script>
  // Soft gating: allow guest usage, but show a note if not logged in
  try{
    const logged = JSON.parse(localStorage.getItem('sgb_logged_in')||'null');
    if(!logged){
      document.addEventListener('DOMContentLoaded', function(){
        const container = document.querySelector('.container');
        const note = document.createElement('div');
        note.style.cssText = 'background:#fff3cd;border:1px solid #ffeeba;color:#856404;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:.9rem;';
        note.innerHTML = '<strong>Lưu ý:</strong> Bạn đang dùng chế độ khách. Bạn có thể tư vấn ngay, nhưng hồ sơ sẽ lưu cục bộ trên thiết bị.';
        container?.insertBefore(note, container.firstChild);
      });
    }
  }catch(e){ /* ignore */ }
  </script>

  <div class="container">
    <div class="topbar">
      <h1>Tư vấn phong cách (AI)</h1>
      <a class="btn" href="SGBweb.html">← Quay lại Trang chủ</a>
    </div>
    <div class="page">
      <section class="card">
        <h2>Hồ sơ của bạn</h2>
        <div class="content">
          <div class="form-row">
            <div class="form-group">
              <label>Giới tính</label>
              <select id="gender">
                <option value="women">Nữ</option>
                <option value="men">Nam</option>
                <option value="unisex">Khác / Unisex</option>
              </select>
            </div>
            <div class="form-group">
              <label>Tuổi</label>
              <input id="age" type="number" min="10" max="100" placeholder="25">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Chiều cao (cm)</label>
              <input id="height_cm" type="number" min="130" max="220" placeholder="165">
            </div>
            <div class="form-group">
              <label>Cân nặng (kg)</label>
              <input id="weight_kg" type="number" min="35" max="150" placeholder="55">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Sở thích màu sắc</label>
              <input id="colors" type="text" placeholder="Đen, trắng, pastel">
            </div>
            <div class="form-group">
              <label>Khí hậu nơi ở</label>
              <select id="climate">
                <option value="tropical">Nhiệt đới</option>
                <option value="temperate">Ôn hòa</option>
                <option value="cold">Lạnh</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Ngân sách</label>
              <select id="budget">
                <option value="low">Tiết kiệm</option>
                <option value="mid" selected>Vừa phải</option>
                <option value="high">Đầu tư</option>
              </select>
            </div>
            <div class="form-group">
              <label>Phom dáng ưa thích</label>
              <select id="fit_preference">
                <option value="regular" selected>Vừa vặn</option>
                <option value="slim">Ôm / Slim</option>
                <option value="oversize">Rộng / Oversize</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Dịp</label>
            <div id="occasions" aria-label="chọn dịp" role="group">
              <label class="pill"><input type="checkbox" value="casual" checked> Casual</label>
              <label class="pill"><input type="checkbox" value="office"> Công sở</label>
              <label class="pill"><input type="checkbox" value="party"> Party</label>
              <label class="pill"><input type="checkbox" value="formal"> Formal</label>
            </div>
          </div>
          <button class="btn" id="saveProfile">Lưu hồ sơ</button>
          <span class="badge" id="sourceBadge"></span>
        </div>
      </section>

      <section class="card">
        <h2>Trợ lý phong cách</h2>
        <div class="chat">
          <div class="chat-log" id="chatLog"></div>
          <div class="chat-input">
            <input id="userMsg" type="text" placeholder="Mô tả nhu cầu: ví dụ set đồ đi làm, màu trung tính…">
            <button class="btn-icon" id="imageSearchTrigger" title="Tìm bằng ảnh" aria-label="Tìm bằng ảnh">+</button>
            <button class="btn" id="sendBtn">Gợi ý</button>
          </div>
          <input id="imageSearchInput" class="file-hidden" type="file" accept="image/*" />
        </div>
        <div class="content image-search">
          <div id="imagePreview" class="image-preview">Chọn ảnh để phân tích</div>
          <div id="imageSearchNote" class="badge"></div>
          <div id="imageSearchResults" class="product-cards"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="style-advisor.js"></script>
  <script src="site.js?v=3"></script>
</body>
</html>
